name: Repair source integrity manifest

on:
  push:
    branches:
      - integration/main-preserving-20261113
    paths:
      - 'jarvis_unified/**'
      - 'scripts/import_jarvis_sources.py'
      - 'tests/test_unified_*.py'
      - 'tests/test_source_import.py'
      - '.github/workflows/**'
      - 'docs/SOURCE_INTEGRITY.sha256'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-integration-branch-writes
  cancel-in-progress: false

jobs:
  refresh-manifest:
    if: github.repository == 'mihran94/JARVIS-AI' && github.ref == 'refs/heads/integration/main-preserving-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore generated PWA icons
        run: python iphone-pwa/icons/restore-icons.py
      - name: Recalculate source hashes from actual checkout
        run: python scripts/source_manifest.py
      - name: Verify source manifest
        run: python scripts/source_manifest.py --check
      - name: Commit only the manifest when it changed
        run: |
          if ! git diff --quiet -- docs/SOURCE_INTEGRITY.sha256; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs/SOURCE_INTEGRITY.sha256
            git commit -m "chore(integrity): refresh source hashes for integration"
            git push origin HEAD:integration/main-preserving-20261113
          fi
      - name: Run full desktop/core suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
