name: Windows monorepo integration installer
on:
  push:
    branches: [main, integration/single-jarvis-20261113, integration/all-remaining-sources-20261113]
    paths:
      - 'desktop/**'
      - 'remote/**'
      - 'providers/**'
      - 'voice/**'
      - 'tests/**'
      - 'installers/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'voice/**'
      - 'installers/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-windows-monorepo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run desktop and protocol tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build standalone desktop folder
        run: |
          python -m pip install pyinstaller==6.12.0 pythonnet==3.2.1 pywin32==312
          # Verify .NET Framework and SAPI are on the Windows build runner,
          # independently of the bundled EXE. No microphone is opened.
          python -c "import clr; clr.AddReference('System.Speech'); from System.Speech.Recognition import Grammar; import win32com.client; win32com.client.Dispatch('SAPI.SpVoice'); print('Native speech imports available on build runner')"
          # The adapters import these modules dynamically when the owner
          # enables voice, so PyInstaller cannot discover them automatically.
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name JarvisAI --hidden-import keyring.backends.Windows --hidden-import clr --hidden-import win32com.client --hidden-import pythoncom --collect-all pythonnet main.py
          if (!(Test-Path 'dist/JarvisAI/JarvisAI.exe')) { throw 'Desktop EXE not generated' }
      - name: Smoke-test the packaged Windows executable
        shell: pwsh
        run: |
          $app = Join-Path (Get-Location) 'dist/JarvisAI/JarvisAI.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged EXE startup failed: $($process.ExitCode)" }
      - name: Smoke-test packaged Windows voice runtime (no audio capture)
        shell: pwsh
        run: |
          $app = Join-Path (Get-Location) 'dist/JarvisAI/JarvisAI.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--check-voice-runtime' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged voice dependencies unavailable: $($process.ExitCode)" }
      - name: Create traceable manifest
        run: python scripts/release_manifest.py dist/JarvisAI dist/JarvisAI-RELEASE.txt --version 0.3.0 --revision "${{ github.sha }}" --channel integration-beta
      - name: Create unsigned Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler 'installers/JARVIS-AI.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed" }
          if (!(Test-Path 'dist/JarvisAI-Setup-Windows-x64.exe')) { throw "Installer not generated" }
      - name: Publish SHA-256 for unsigned installer
        shell: pwsh
        run: |
          (Get-FileHash 'dist/JarvisAI-Setup-Windows-x64.exe' -Algorithm SHA256).Hash.ToLower() + '  JarvisAI-Setup-Windows-x64.exe' | Out-File -FilePath 'dist/JarvisAI-Setup-Windows-x64.sha256' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-unified-windows-unsigned-${{ github.sha }}
          path: |
            dist/JarvisAI/**
            dist/JarvisAI-RELEASE.txt
            dist/JarvisAI-Setup-Windows-x64.exe
            dist/JarvisAI-Setup-Windows-x64.sha256
          retention-days: 14
          if-no-files-found: error
