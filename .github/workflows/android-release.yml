name: JARVIS BLUE - Publish Android update
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Exact app versionName (e.g. 1.1.7)
        required: true
        type: string
      notes:
        description: Public release notes
        required: true
        type: string
      confirm_public_release:
        description: Publish APK publicly to JARVIS-Mobile-Beta
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jarvis-blue-release
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_public_release == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-release
    env:
      PUBLIC_REPO: mihran94/JARVIS-Mobile-Beta
      RELEASE_VERSION: ${{ inputs.version_name }}
      RELEASE_NOTES: ${{ inputs.notes }}
      EXPECTED_CERT: ${{ vars.JARVIS_RELEASE_CERT_SHA256 }}
      STORE_B64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.JARVIS_BETA_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: SDK setup
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Version and credentials preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,pathlib
          t=pathlib.Path('app/build.gradle.kts').read_text()
          v=re.search(r'versionName\s*=\s*"([^"]+)"',t)
          c=re.search(r'versionCode\s*=\s*(\d+)',t)
          requested=os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',requested) or not v or v.group(1)!=requested or not c:
              raise SystemExit('STOP: GitHub source version mismatches requested release; sync tested source first')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('VERSION_CODE='+c.group(1)+'\n')
          PY
          for var in EXPECTED_CERT STORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD GH_TOKEN; do
            test -n "$(printenv "$var")" || { echo "Missing secret or variable: $var"; exit 1; }
          done
          if find . -type f \( -name '*.p12' -o -name '*.jks' -o -name 'keystore.properties' -o -name '.env' \) | grep -q .; then
            echo 'Signing material found in repository checkout'; exit 1
          fi
          test -f scripts/create_update_manifest.py || { echo 'Sync new JARVIS source first'; exit 1; }
      - name: Prepare temporary signing material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf %s "$STORE_B64" | base64 -d > keystore/release.p12
          chmod 600 keystore/release.p12
          python3 - <<'PY'
          import os,pathlib
          def esc(s): return s.replace('\\','\\\\').replace('\n','\\n').replace('\r','\\r').replace('=','\\=').replace(':','\\:')
          props={'storeFile':'keystore/release.p12','storePassword':os.environ['STORE_PASSWORD'],
                 'keyAlias':os.environ['KEY_ALIAS'],'keyPassword':os.environ['KEY_PASSWORD']}
          pathlib.Path('keystore/keystore.properties').write_text(''.join(f'{k}={esc(v)}\n' for k,v in props.items()))
          PY
          chmod 600 keystore/keystore.properties
      - name: Build signed release
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify APK and build update.json
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > signer.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" > badging.txt
          python3 - <<'PY'
          import os,pathlib,re
          cert=pathlib.Path('signer.txt').read_text()
          match=re.search(r'certificate SHA-256 digest:\s*([0-9a-f]{64})',cert,re.I)
          if not match or match.group(1).lower()!=os.environ['EXPECTED_CERT'].lower().replace(':',''):
              raise SystemExit('STOP: APK certificate differs from original installed release')
          meta=pathlib.Path('badging.txt').read_text()
          pkg=re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",meta)
          if not pkg or pkg.groups()!=('com.jarvisblue.mobile',os.environ['VERSION_CODE'],os.environ['RELEASE_VERSION']):
              raise SystemExit('STOP: APK package/version mismatch')
          PY
          mkdir -p output
          cp "$apk" "output/JARVIS-BLUE-MOBILE-$RELEASE_VERSION-release.apk"
          python3 scripts/create_update_manifest.py \
            --apk "output/JARVIS-BLUE-MOBILE-$RELEASE_VERSION-release.apk" \
            --apk-url "https://github.com/$PUBLIC_REPO/releases/download/v$RELEASE_VERSION/JARVIS-BLUE-MOBILE-$RELEASE_VERSION-release.apk" \
            --package-id com.jarvisblue.mobile --version-code "$VERSION_CODE" \
            --version-name "$RELEASE_VERSION" --notes "$RELEASE_NOTES" --output output/update.json
      - name: Publish to public download repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PUBLIC_REPO" --jq .visibility)" = public
          if gh release view "v$RELEASE_VERSION" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo 'Release tag exists; refusing overwrite'; exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt
          gh release create "v$RELEASE_VERSION" "output/JARVIS-BLUE-MOBILE-$RELEASE_VERSION-release.apk" \
            -R "$PUBLIC_REPO" --draft --title "JARVIS BLUE MOBILE v$RELEASE_VERSION" --notes-file release-notes.txt
          gh release edit "v$RELEASE_VERSION" -R "$PUBLIC_REPO" --draft=false
      - name: Publish public update feed
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$PUBLIC_REPO/contents/update.json" --jq .sha 2>/dev/null || true)
          args=(-X PUT -f "message=JARVIS BLUE update feed v$RELEASE_VERSION" -f "content=$(base64 -w0 output/update.json)" -f branch=main)
          if [[ -n "$sha" ]]; then args+=(-f "sha=$sha"); fi
          gh api "repos/$PUBLIC_REPO/contents/update.json" "${args[@]}" >/dev/null
          echo "Feed: https://raw.githubusercontent.com/$PUBLIC_REPO/main/update.json"
      - name: Erase temporary signing files
        if: always()
        run: rm -f keystore/release.p12 keystore/keystore.properties signer.txt badging.txt release-notes.txt
